[project]
name = "logo-tools"
version = "0.1.0"
description = "Small composable image tools for building logo-editing macros"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["logo_tools*"]
